<!DOCTYPE html>
<html>
  <head>
    <title>Barry B. Benson Pet Game</title>
    <meta name="description" content="A Barry B. Benson themed Giga Pet game">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        Meet Barry B. Benson
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
<img class="pet-image" src="images/Barry-B-Benson.webp" alt="Barry B. Benson">      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pollen points</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> buzz levels</strong></div>

        <div class="button-container">
          <button class="treat-button">Honey Treat</button>
          <button class="play-button">Fly Around</button>
          <button class="exercise-button">Work Out</button>
          <button class="sleep-button">Rest Wings</button>
        </div>

        <div class="pet-comment">
          Barry is ready to buzz around.
        </div>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
